<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Gia - HR Assistant</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #2563eb;
      --primary-dark: #1d4ed8;
      --primary-light: #3b82f6;
      --success: #10b981;
      --warning: #f59e0b;
      --error: #ef4444;
      --gray-50: #f9fafb;
      --gray-100: #f3f4f6;
      --gray-200: #e5e7eb;
      --gray-300: #d1d5db;
      --gray-400: #9ca3af;
      --gray-500: #6b7280;
      --gray-600: #4b5563;
      --gray-700: #374151;
      --gray-800: #1f2937;
      --gray-900: #111827;
      --white: #ffffff;
      --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
      --shadow: 0 1px 3px 0 rgb(0 0 0 / 0.1), 0 1px 2px -1px rgb(0 0 0 / 0.1);
      --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
      --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1);
      --shadow-xl: 0 20px 25px -5px rgb(0 0 0 / 0.1), 0 8px 10px -6px rgb(0 0 0 / 0.1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: linear-gradient(135deg, var(--gray-100) 0%, var(--gray-200) 100%);
      color: var(--gray-800);
      padding: 20px;
    }

    #chat-container {
      width: 100%;
      max-width: 800px;
      height: 85vh;
      max-height: 700px;
      background: var(--white);
      border-radius: 16px;
      box-shadow: var(--shadow-xl);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      animation: fadeIn 0.3s ease-out;
    }

    #chat-header {
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
      color: var(--white);
      padding: 20px 24px;
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .header-icon {
      width: 44px;
      height: 44px;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
    }

    .header-content {
      flex: 1;
    }

    .header-title {
      font-size: 1.25rem;
      font-weight: 700;
      margin-bottom: 2px;
    }

    .header-subtitle {
      font-size: 0.875rem;
      opacity: 0.9;
      font-weight: 400;
    }

    #status {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-size: 0.8rem;
      color: var(--gray-500);
      padding: 10px 24px;
      background: var(--gray-50);
      border-bottom: 1px solid var(--gray-200);
      font-weight: 500;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--gray-400);
      animation: pulse 2s ease-in-out infinite;
    }

    .status-dot.connected {
      background: var(--success);
    }

    .status-dot.disconnected {
      background: var(--error);
    }

    #chat-window {
      flex: 1;
      padding: 24px;
      overflow-y: auto;
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
      gap: 16px;
      background: var(--gray-50);
      scroll-behavior: smooth;
      -webkit-overflow-scrolling: touch;
    }

    #chat-window::-webkit-scrollbar {
      width: 6px;
    }

    #chat-window::-webkit-scrollbar-track {
      background: transparent;
    }

    #chat-window::-webkit-scrollbar-thumb {
      background: var(--gray-300);
      border-radius: 3px;
    }

    #chat-window::-webkit-scrollbar-thumb:hover {
      background: var(--gray-400);
    }

    .message {
      max-width: 80%;
      padding: 14px 18px;
      border-radius: 16px;
      line-height: 1.6;
      font-size: 0.9375rem;
      animation: slideUp 0.2s ease-out;
      word-wrap: break-word;
    }

    .user-message {
      align-self: flex-end;
      background: var(--primary);
      color: var(--white);
      border-bottom-right-radius: 4px;
      box-shadow: var(--shadow-sm);
      white-space: pre-wrap;
    }

    .bot-message {
      align-self: flex-start;
      background: var(--white);
      color: var(--gray-800);
      border: 1px solid var(--gray-200);
      border-bottom-left-radius: 4px;
      box-shadow: var(--shadow-sm);
      font-size: 0.9375rem;
      line-height: 1.7;
      letter-spacing: 0.01em;
    }

    .bot-message p {
      margin: 0 0 14px 0;
      line-height: 1.7;
    }

    .bot-message p:last-child {
      margin-bottom: 0;
    }

    /* Section headers in responses */
    .bot-message .section-header {
      font-weight: 600;
      color: var(--gray-900);
      margin-top: 16px;
      margin-bottom: 8px;
      display: block;
    }

    .bot-message .section-header:first-child {
      margin-top: 0;
    }

    /* Formatted text styling for bot messages */
    .bot-message ul,
    .bot-message ol {
      margin: 10px 0 14px 0;
      padding-left: 8px;
      list-style: none;
    }

    .bot-message li {
      margin-bottom: 10px;
      line-height: 1.65;
      padding-left: 20px;
      position: relative;
    }

    .bot-message li::before {
      content: "•";
      position: absolute;
      left: 0;
      color: var(--primary);
      font-weight: bold;
      font-size: 1.1em;
    }

    .bot-message ol li {
      counter-increment: item;
    }

    .bot-message ol li::before {
      content: counter(item) ".";
      font-weight: 600;
      color: var(--primary);
    }

    .bot-message li:last-child {
      margin-bottom: 0;
    }

    /* Inline bullet and number styling for live streaming */
    .bot-message .inline-bullet {
      color: var(--primary);
      font-weight: bold;
      font-size: 1.1em;
      margin-right: 6px;
    }

    .bot-message .inline-number {
      color: var(--primary);
      font-weight: 600;
      margin-right: 4px;
    }

    .bot-message strong,
    .bot-message b {
      font-weight: 600;
      color: var(--gray-900);
      letter-spacing: 0.01em;
    }

    .bot-message em,
    .bot-message i {
      font-style: italic;
      color: var(--gray-700);
    }

    .bot-message code {
      background: var(--gray-100);
      padding: 3px 7px;
      border-radius: 4px;
      font-family: 'SF Mono', 'Menlo', 'Monaco', 'Consolas', monospace;
      font-size: 0.85em;
      color: var(--primary-dark);
      border: 1px solid var(--gray-200);
    }

    .bot-message a {
      color: var(--primary);
      text-decoration: none;
    }

    .bot-message a:hover {
      text-decoration: underline;
    }

    .bot-message h1,
    .bot-message h2,
    .bot-message h3,
    .bot-message h4 {
      font-weight: 600;
      color: var(--gray-900);
      margin: 12px 0 8px 0;
    }

    .bot-message h1:first-child,
    .bot-message h2:first-child,
    .bot-message h3:first-child {
      margin-top: 0;
    }

    .bot-message blockquote {
      border-left: 3px solid var(--primary);
      padding-left: 12px;
      margin: 8px 0;
      color: var(--gray-600);
      font-style: italic;
    }

    .bot-message hr {
      border: none;
      border-top: 1px solid var(--gray-200);
      margin: 12px 0;
    }

    .bot-message .highlight {
      background: linear-gradient(120deg, rgba(37, 99, 235, 0.1) 0%, rgba(37, 99, 235, 0.05) 100%);
      padding: 2px 4px;
      border-radius: 3px;
    }

    /* Typing cursor animation */
    .typing-cursor {
      display: inline-block;
      width: 2px;
      height: 1.1em;
      background: var(--primary);
      margin-left: 2px;
      vertical-align: text-bottom;
      animation: blink 0.8s ease-in-out infinite;
    }

    .bot-message.streaming {
      position: relative;
    }

    .bot-message.streaming p {
      display: inline;
    }

    /* Smooth text appearance */
    @keyframes blink {
      0%, 50% { opacity: 1; }
      51%, 100% { opacity: 0; }
    }

    @keyframes charFade {
      from { opacity: 0.3; }
      to { opacity: 1; }
    }

    .char-animate {
      animation: charFade 0.15s ease-out forwards;
    }

    #chat-form {
      display: flex;
      padding: 16px 20px;
      background: var(--white);
      border-top: 1px solid var(--gray-200);
      gap: 12px;
      align-items: center;
    }

    #message-input {
      flex: 1;
      padding: 12px 16px;
      border: 1px solid var(--gray-300);
      border-radius: 12px;
      outline: none;
      font-size: 0.9375rem;
      font-family: inherit;
      transition: border-color 0.2s, box-shadow 0.2s;
      background: var(--white);
      color: var(--gray-800);
    }

    #message-input::placeholder {
      color: var(--gray-400);
    }

    #message-input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
    }

    #send-button {
      background: var(--primary);
      color: var(--white);
      border: none;
      padding: 12px 24px;
      border-radius: 12px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.9375rem;
      font-family: inherit;
      transition: background-color 0.2s, transform 0.1s;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    #send-button:hover {
      background: var(--primary-dark);
    }

    #send-button:active {
      transform: scale(0.98);
    }

    #send-button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    #send-button svg {
      width: 18px;
      height: 18px;
    }

    /* Loader */
    .loader {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 4px 0;
    }

    .loader-dot {
      width: 6px;
      height: 6px;
      background: var(--gray-400);
      border-radius: 50%;
      animation: bounce 1s infinite;
    }

    .loader-dot:nth-child(2) {
      animation-delay: 0.15s;
    }

    .loader-dot:nth-child(3) {
      animation-delay: 0.3s;
    }

    /* Welcome message */
    .welcome-message {
      text-align: center;
      padding: 40px 20px;
      color: var(--gray-500);
    }

    .welcome-icon {
      font-size: 3rem;
      margin-bottom: 16px;
    }

    .welcome-title {
      font-size: 1.125rem;
      font-weight: 600;
      color: var(--gray-700);
      margin-bottom: 8px;
    }

    .welcome-text {
      font-size: 0.875rem;
      line-height: 1.6;
    }

    /* Animations */
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes bounce {
      0%, 60%, 100% { transform: translateY(0); }
      30% { transform: translateY(-4px); }
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    /* Responsive */
    @media (max-width: 768px) {
      body {
        padding: 0;
      }

      #chat-container {
        height: 100vh;
        max-height: none;
        border-radius: 0;
      }

      #chat-header {
        padding: 16px 20px;
      }

      .header-icon {
        width: 40px;
        height: 40px;
      }

      .header-title {
        font-size: 1.125rem;
      }

      #chat-window {
        padding: 16px;
      }

      .message {
        max-width: 85%;
        font-size: 0.875rem;
      }

      #chat-form {
        padding: 12px 16px;
      }

      #send-button {
        padding: 12px 16px;
      }

      #send-button span {
        display: none;
      }
    }
  </style>
</head>

<body>
  <div id="chat-container">
    <div id="chat-header">
      <div class="header-icon">💬</div>
      <div class="header-content">
        <div class="header-title">Gia</div>
        <div class="header-subtitle">Gentari HR Assistant</div>
      </div>
    </div>
    <div id="status">
      <span class="status-dot"></span>
      <span class="status-text">Connecting...</span>
    </div>
    <div id="chat-window">
      <div class="welcome-message">
        <div class="welcome-icon">👋</div>
        <div class="welcome-title">Welcome to Gia</div>
        <div class="welcome-text">I'm your HR assistant. Ask me anything about company policies, benefits, or procedures.</div>
      </div>
    </div>
    <form id="chat-form">
      <input type="text" id="message-input" placeholder="Type your question..." autocomplete="off" disabled />
      <button type="submit" id="send-button" disabled>
        <span>Send</span>
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
          <path d="M3.478 2.405a.75.75 0 00-.926.94l2.432 7.905H13.5a.75.75 0 010 1.5H4.984l-2.432 7.905a.75.75 0 00.926.94 60.519 60.519 0 0018.445-8.986.75.75 0 000-1.218A60.517 60.517 0 003.478 2.405z" />
        </svg>
      </button>
    </form>
  </div>

  <script defer>
    document.addEventListener('DOMContentLoaded', () => {
      const OLLAMA_URL = 'http://localhost:11434';
      
      const chatWindow = document.getElementById("chat-window");
      const messageInput = document.getElementById("message-input");
      const chatForm = document.getElementById("chat-form");
      const sendButton = document.getElementById("send-button");
      const statusDiv = document.getElementById("status");
      const statusDot = statusDiv.querySelector(".status-dot");
      const statusText = statusDiv.querySelector(".status-text");
      
      let currentBotMessageElement = null;
      let currentBotMessageContainer = null;
      let cursorElement = null;
      let loaderElement = null;
      let isScrolledToBottom = true;
      let welcomeRemoved = false;
      let isStreaming = false;
      let rawTextBuffer = '';  // Full accumulated text
      let displayedLength = 0;  // How much we've shown so far
      let isTyping = false;

      // Create blinking cursor
      function createCursor() {
        if (cursorElement) return cursorElement;
        cursorElement = document.createElement('span');
        cursorElement.className = 'typing-cursor';
        return cursorElement;
      }

      // Remove cursor when done
      function removeCursor() {
        if (cursorElement && cursorElement.parentNode) {
          cursorElement.remove();
        }
        cursorElement = null;
      }

      // Format and render text incrementally during streaming - stable line-by-line processing
      function formatPartialText(text) {
        if (!text) return '';
        
        // Split into lines and format each separately for stability
        const lines = text.split('\n');
        const formattedLines = lines.map((line, index) => {
          let html = line
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;');
          
          // Check if line is a bullet point
          const bulletMatch = html.match(/^[-•*]\s+(.*)$/);
          if (bulletMatch) {
            html = '<span class="inline-bullet">•</span> ' + formatInline(bulletMatch[1]);
          }
          // Check if line is a numbered item
          else {
            const numberMatch = html.match(/^(\d+)[.)]\s+(.*)$/);
            if (numberMatch) {
              html = '<span class="inline-number">' + numberMatch[1] + '.</span> ' + formatInline(numberMatch[2]);
            } else {
              html = formatInline(html);
            }
          }
          
          return html;
        });
        
        return formattedLines.join('<br>');
      }
      
      // Format inline elements (bold, italic, code, links)
      function formatInline(text) {
        if (!text) return '';
        
        let html = text;
        
        // Bold - match complete patterns only
        html = html.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
        html = html.replace(/__([^_]+)__/g, '<strong>$1</strong>');
        
        // Italic - match complete patterns only (avoid conflict with bullets)
        html = html.replace(/(?<!\*)\*([^*]+)\*(?!\*)/g, '<em>$1</em>');
        html = html.replace(/(?<!_)_([^_]+)_(?!_)/g, '<em>$1</em>');
        
        // Code
        html = html.replace(/`([^`]+)`/g, '<code>$1</code>');
        
        // Emails
        html = html.replace(/([a-zA-Z0-9._-]+@[a-zA-Z0-9._-]+\.[a-zA-Z0-9._-]+)/gi, '<a href="mailto:$1">$1</a>');
        
        // URLs
        html = html.replace(/(https?:\/\/[^\s<]+)/gi, '<a href="$1" target="_blank" rel="noopener">$1</a>');
        
        return html;
      }

      // Smooth character-by-character typing with live formatting
      async function typeCharacters() {
        if (isTyping) return;
        isTyping = true;
        
        while (displayedLength < rawTextBuffer.length) {
          if (currentBotMessageElement) {
            displayedLength++;
            const partialText = rawTextBuffer.slice(0, displayedLength);
            
            // Format and render the partial text
            currentBotMessageElement.innerHTML = formatPartialText(partialText);
            
            // Keep cursor at end
            if (cursorElement) {
              currentBotMessageElement.appendChild(cursorElement);
            }
            
            scrollToBottom();
            
            // Vary delay for natural feel
            const char = rawTextBuffer[displayedLength - 1];
            const delay = char === ' ' ? 3 : (char === '.' || char === ',' || char === '\n' ? 20 : 8);
            await new Promise(r => setTimeout(r, delay));
          } else {
            break;
          }
        }
        isTyping = false;
      }

      // Check both Flask (for RAG) and Ollama health
      async function checkHealth() {
        try {
          const [flaskRes, ollamaRes] = await Promise.all([
            fetch('/healthz'),
            fetch(`${OLLAMA_URL}/api/tags`)
          ]);
          
          if (flaskRes.ok && ollamaRes.ok) {
            statusDot.classList.add("connected");
            statusDot.classList.remove("disconnected");
            statusText.textContent = "Ready (Direct LLM)";
            messageInput.disabled = false;
            sendButton.disabled = false;
            setTimeout(() => statusDiv.style.display = "none", 1500);
            return true;
          }
        } catch (e) {
          console.error("Health check failed:", e);
        }
        statusDot.classList.remove("connected");
        statusDot.classList.add("disconnected");
        statusText.textContent = "Service unavailable";
        return false;
      }

      checkHealth();

      const checkScrollPosition = () => {
        const threshold = 100;
        isScrolledToBottom = chatWindow.scrollHeight - chatWindow.scrollTop - chatWindow.clientHeight < threshold;
      };

      chatWindow.addEventListener("scroll", checkScrollPosition, { passive: true });

      const scrollToBottom = () => {
        if (isScrolledToBottom) {
          chatWindow.scrollTop = chatWindow.scrollHeight;
        }
      };

      const removeWelcome = () => {
        if (!welcomeRemoved) {
          const welcome = chatWindow.querySelector('.welcome-message');
          if (welcome) welcome.remove();
          welcomeRemoved = true;
        }
      };

      chatForm.addEventListener("submit", async (event) => {
        event.preventDefault();
        if (isStreaming) return;
        
        const message = messageInput.value.trim();
        if (!message) return;
        
        removeWelcome();
        appendMessage(message, "user");
        messageInput.value = "";
        messageInput.focus();
        createBotMessageElement();
        showLoader();
        
        isStreaming = true;
        sendButton.disabled = true;
        rawTextBuffer = '';
        displayedLength = 0;
        
        try {
          // Step 1: Get RAG context from Flask
          const prepRes = await fetch('/api/prepare', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ message })
          });
          
          if (!prepRes.ok) throw new Error('Failed to prepare context');
          
          const prepData = await prepRes.json();
          
          if (loaderElement) {
            loaderElement.remove();
            loaderElement = null;
          }
          
          // Check if it's a simple greeting - show response directly
          if (prepData.is_greeting) {
            rawTextBuffer = prepData.response;
            typeCharacters();
            
            // Wait for typing to finish
            while (displayedLength < rawTextBuffer.length || isTyping) {
              await new Promise(r => setTimeout(r, 20));
            }
            
            removeCursor();
            if (currentBotMessageContainer) {
              currentBotMessageContainer.classList.remove('streaming');
            }
          } else {
            // Step 2: Stream from Ollama for actual questions
            const { prompt, model, options } = prepData;
          const response = await fetch(`${OLLAMA_URL}/api/chat`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              model: model,
              messages: [{ role: 'user', content: prompt }],
              stream: true,
              options: options
            })
          });
          
          if (!response.ok) throw new Error('Ollama error');
          
          const reader = response.body.getReader();
          const decoder = new TextDecoder();
          
          while (true) {
            const { done, value } = await reader.read();
            if (done) break;
            
            const chunk = decoder.decode(value, { stream: true });
            // Ollama returns newline-delimited JSON
            const lines = chunk.split('\n').filter(l => l.trim());
            
            for (const line of lines) {
              try {
                const json = JSON.parse(line);
                if (json.message && json.message.content) {
                  // Add to buffer for smooth character typing with live formatting
                  rawTextBuffer += json.message.content;
                  typeCharacters();
                }
                if (json.done) break;
              } catch (e) {
                // Skip invalid JSON lines
              }
            }
          }
          
          // Wait for remaining characters to finish typing
          while (displayedLength < rawTextBuffer.length || isTyping) {
            await new Promise(r => setTimeout(r, 20));
          }
          
          // Remove cursor and streaming class
          removeCursor();
          if (currentBotMessageContainer) {
            currentBotMessageContainer.classList.remove('streaming');
          }
          } // End of else block for non-greeting messages
          
        } catch (error) {
          console.error("Stream error:", error);
          if (loaderElement) {
            loaderElement.remove();
            loaderElement = null;
          }
          if (currentBotMessageElement) {
            currentBotMessageElement.textContent = "Sorry, an error occurred. Please try again.";
          }
        } finally {
          removeCursor();
          currentBotMessageElement = null;
          currentBotMessageContainer = null;
          isStreaming = false;
          sendButton.disabled = false;
          scrollToBottom();
        }
      });

      // Simple markdown-like formatter for bot responses
      function formatMessage(text) {
        if (!text) return '';
        
        let html = text
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;');
        
        html = html.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
        html = html.replace(/__(.+?)__/g, '<strong>$1</strong>');
        html = html.replace(/\*(.+?)\*/g, '<em>$1</em>');
        html = html.replace(/_(.+?)_/g, '<em>$1</em>');
        html = html.replace(/`([^`]+)`/g, '<code>$1</code>');
        html = html.replace(/([a-zA-Z0-9._-]+@[a-zA-Z0-9._-]+\.[a-zA-Z0-9._-]+)/gi, '<a href="mailto:$1">$1</a>');
        html = html.replace(/(https?:\/\/[^\s]+)/gi, '<a href="$1" target="_blank" rel="noopener">$1</a>');
        
        const lines = html.split('\n');
        let result = [];
        let inList = false;
        let listType = '';
        let currentParagraph = [];
        
        for (let i = 0; i < lines.length; i++) {
          const line = lines[i].trim();
          const bulletMatch = line.match(/^[-•*]\s+(.+)$/);
          const numberedMatch = line.match(/^\d+[.)]\s+(.+)$/);
          
          if (bulletMatch) {
            if (currentParagraph.length > 0) {
              result.push('<p>' + currentParagraph.join(' ') + '</p>');
              currentParagraph = [];
            }
            if (!inList || listType !== 'ul') {
              if (inList) result.push('</' + listType + '>');
              result.push('<ul>');
              inList = true;
              listType = 'ul';
            }
            result.push('<li>' + bulletMatch[1] + '</li>');
          } else if (numberedMatch) {
            if (currentParagraph.length > 0) {
              result.push('<p>' + currentParagraph.join(' ') + '</p>');
              currentParagraph = [];
            }
            if (!inList || listType !== 'ol') {
              if (inList) result.push('</' + listType + '>');
              result.push('<ol>');
              inList = true;
              listType = 'ol';
            }
            result.push('<li>' + numberedMatch[1] + '</li>');
          } else {
            if (inList) {
              result.push('</' + listType + '>');
              inList = false;
              listType = '';
            }
            if (line === '') {
              if (currentParagraph.length > 0) {
                result.push('<p>' + currentParagraph.join(' ') + '</p>');
                currentParagraph = [];
              }
            } else {
              currentParagraph.push(line);
            }
          }
        }
        
        if (inList) result.push('</' + listType + '>');
        if (currentParagraph.length > 0) {
          result.push('<p>' + currentParagraph.join(' ') + '</p>');
        }
        
        return result.length === 0 ? '<p>' + html.replace(/\n/g, '<br>') + '</p>' : result.join('');
      }

      function appendMessage(text, sender) {
        const messageElement = document.createElement("div");
        messageElement.className = "message " + sender + "-message";
        messageElement.textContent = text;
        chatWindow.appendChild(messageElement);
        scrollToBottom();
      }

      function createBotMessageElement() {
        const messageElement = document.createElement("div");
        messageElement.className = "message bot-message streaming";
        currentBotMessageElement = document.createElement("span");
        currentBotMessageContainer = messageElement;
        messageElement.appendChild(currentBotMessageElement);
        
        // Add blinking cursor
        createCursor();
        currentBotMessageElement.appendChild(cursorElement);
        
        chatWindow.appendChild(messageElement);
        scrollToBottom();
      }

      function showLoader() {
        if (loaderElement) return;
        loaderElement = document.createElement("div");
        loaderElement.className = "loader";
        loaderElement.innerHTML = '<span class="loader-dot"></span><span class="loader-dot"></span><span class="loader-dot"></span>';
        if (currentBotMessageElement) {
          currentBotMessageElement.appendChild(loaderElement);
        }
        scrollToBottom();
      }

      messageInput.focus();
    });
  </script>
